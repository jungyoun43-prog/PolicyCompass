name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_deploy*.py'
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: policycompass-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: 782419713811.dkr.ecr.ap-northeast-2.amazonaws.com/policycompass
      APP_URL: https://3.34.51.246
      LIGHTSAIL_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPDnj/kF0gjcB1DXpaL9nNtabq3lMg8D7Sa62ADJv4oX
    steps:
      - uses: actions/checkout@v4
      - name: Skip a superseded commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping deployment."
          fi
      - name: Authenticate to AWS using GitHub OIDC
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::782419713811:role/PolicyCompassGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        if: steps.current.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push deployment image
        if: steps.current.outputs.deploy == 'true'
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy image and verify service
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_IMAGE: ${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
          APP_REVISION: ${{ github.sha }}
          LIGHTSAIL_DEPLOY_SSH_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_SSH_KEY }}
          LIGHTSAIL_INSTALL_RECEIVER: ${{ vars.LIGHTSAIL_INSTALL_RECEIVER }}
        run: python3 scripts/deploy-lightsail.py
